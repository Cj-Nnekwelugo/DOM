<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countíng-increase & decrease </title>
<style>
   
    body{
        background-color: wheat;
        text-align: center;
        font-family: sans-serif;

    }
    h1 {
        align-items: end;
        font-size: 50px;
    }
    div {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        
    }
    button {
        gap: 6rem;
        background-color: rgb(132, 141, 221);
        cursor: pointer;
        border: none;
        border-radius: 14px;
        padding: 1rem 1rem;
    }
    
</style>
</head>

<body>
    <h1>Count: <span id="count">0</span></h1>

    <div>
        <button id="increaseCount">Increase Count</button>
        <button id="decreaseCount">Decrease Count</button>
    </div>


    <script>
        let count = 0;

        const displayCount = document.getElementById("count");
        const increaseCountBtn = document.getElementById("increaseCount");
        const decreaseCountBtn = document.getElementById("decreaseCount");

        increaseCountBtn.addEventListener("click", function() {
            count++;
            displayCount.textContent = count;

        }
    );
     decreaseCountBtn.addEventListener("click", function() {
            count--;
            displayCount.textContent = count;

        }
    );


    </script>
</body>
</html>
