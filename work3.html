<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate by 5</title>
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }

    span {
        display: block;
    }

    #number {
        width: 220px;
        padding: 10px 12px;
        font-size: 16px;
        border: 2px solid #cbd2d9;
        border-radius: 6px;
        outline: none;
    }

    #number:focus {
        border-color: #2563eb;
    }

    div {
        display: flex;
        gap: 10px;
        justify-content: center;
    }

    button {
        padding: 10px 18px;
        font-size: 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: #fff;
        transition: background 0.2s, transform 0.1s;
    }

    button:active {
        transform: scale(0.97);
    }

    #multiply {
        background: #2563eb;
    }

    #multiply:hover {
        background: #1d4ed8;
    }

    #reset {
        background: #6b7280;
    }

    #reset:hover {
        background: #4b5563;
    }

    #result {
        font-size: 18px;
        font-weight: bold;
        color: #111827;
        text-align: center;
        white-space: pre-line; /* needed if you use the times table version */
    }
</style>
<body>
    <span>
        <input type="number"
        id="number"
        placeholder="0"
        >
    </span>
   <div>
    <button id="multiply">Multiply by 10</button>
    <button id="reset">Reset</button>
   </div>
    <button id="result">Result</button>

    <script>
      
    const enterNumber = document.getElementById("number");
    const increaseMultiply = document.getElementById("multiply");
    const resetNumber = document.getElementById("reset");
    const result = document.getElementById("result");

    increaseMultiply.addEventListener("click", function(){
        const value = Number(enterNumber.value);
        result.textContent = value + " × 10 = " + value * 10;

    });
      
    resetNumber.addEventListener("click", function(){
        enterNumber.value = "";
        result.textContent = "";
        resetNumber.focus()
    });
   
    
         </script>
</body>
</html>
