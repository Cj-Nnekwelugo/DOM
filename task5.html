<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #1e293b;
        }

        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        /* Show/Hide Password Styling */
        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: -10px;
            margin-bottom: 18px;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
        }

        .show-password input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .login-text {
            margin-top: 20px;
            margin-bottom: 0;
            font-size: 14px;
        }

        .login-text a {
            color: #2563eb;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Create Account</h2>
        <p>Fill in your details to get started.</p>

        <form action="#" method="post">

            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
                minlength="8"
            >

            <label for="show-password" class="show-password">
                <input type="checkbox" id="show-password">
                Show password
            </label>

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm your password"
                required
                minlength="8"
            >

            <label for="show-confirm-password" class="show-password">
                <input type="checkbox" id="show-confirm-password">
                Show confirm password
            </label>

            <button type="submit" id="submit">Register</button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="#">Login</a>
        </p>

    </div>

    <script>
        const form = document.querySelector("form");

        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");

        const showPassword = document.getElementById("show-password");
        const showConfirmPassword = document.getElementById("show-confirm-password");

       
        showPassword.addEventListener("change", function(){
            if (showPassword.checked) {
                password.type = "text";
            } else {
                password.type = "password";
            }
        });

        showConfirmPassword.addEventListener("change", function(){
            if (showConfirmPassword.checked) {
                confirmPassword.type = "text";
            } else {
                confirmPassword.type = "password";
            }
        });


        
        form.addEventListener("submit", function(event) {
            event.preventDefault();

            if (password.value !== confirmPassword.value) {
                alert("Passwords do not match!");
            } else {
                alert("Registration successful!");
                form.reset();
            }
        });
    </script>

</body>
</html>
